<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Ağustos 2027 Geri Sayım</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center;
  justify-content: center; font-family: Arial, sans-serif;
  background: #111; color: #fff;
}
.card {
  width: min(800px, 92vw); text-align: center; padding: 40px 22px;
  border-radius: 24px; background: #1d1d1d;
}
h1 { font-size: clamp(28px, 6vw, 52px); margin: 0 0 10px; }
.date { font-size: 20px; opacity: .75; margin-bottom: 30px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.box { background: #292929; border-radius: 16px; padding: 22px 8px; }
.num { font-size: clamp(32px, 7vw, 64px); font-weight: 700; }
.label { font-size: 14px; opacity: .7; margin-top: 7px; }
.done { font-size: 30px; font-weight: bold; }
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="card">
  <h1>⏳ İŞ BİTİŞ SAYACI</h1>
  <div class="date">15 Ağustos 2027 • 00:00</div>
  <div id="countdown" class="grid"></div>
</div>

<script>
const target = new Date("2027-08-15T00:00:00+03:00").getTime();
const el = document.getElementById("countdown");

function update() {
  let diff = target - Date.now();

  if (diff <= 0) {
    el.className = "done";
    el.innerHTML = "✅ SÜRE DOLDU";
    return;
  }

  const day = Math.floor(diff / 86400000);
  diff %= 86400000;

  const hour = Math.floor(diff / 3600000);
  diff %= 3600000;

  const minute = Math.floor(diff / 60000);
  diff %= 60000;

  const second = Math.floor(diff / 1000);

  el.innerHTML = `
    <div class="box"><div class="num">${day}</div><div class="label">GÜN</div></div>
    <div class="box"><div class="num">${String(hour).padStart(2,"0")}</div><div class="label">SAAT</div></div>
    <div class="box"><div class="num">${String(minute).padStart(2,"0")}</div><div class="label">DAKİKA</div></div>
    <div class="box"><div class="num">${String(second).padStart(2,"0")}</div><div class="label">SANİYE</div></div>
  `;
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
