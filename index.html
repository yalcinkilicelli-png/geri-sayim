<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İş Bitiş Sayacı</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef2f5;
  font-family: Arial, Helvetica, sans-serif;
  color: #10254a;
}

.container {
  width: min(900px, 100%);
  margin: auto;
  background: white;
  text-align: center;
  padding: 25px 20px 0;
}

h1 {
  margin: 0 0 10px;
  font-size: clamp(30px, 6vw, 58px);
  letter-spacing: 1px;
}

.target {
  font-size: clamp(20px, 4vw, 32px);
  font-weight: bold;
  color: #3b7f25;
  margin-bottom: 25px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.box {
  background: #102d5b;
  color: white;
  border-radius: 16px;
  padding: 22px 8px 17px;
  box-shadow: 0 5px 12px rgba(0,0,0,.18);
}

.num {
  font-size: clamp(34px, 7vw, 68px);
  font-weight: 800;
  line-height: 1;
}

.label {
  margin-top: 10px;
  font-size: clamp(12px, 2vw, 17px);
  color: #8bd12b;
  font-weight: bold;
}

.note {
  margin: 22px 0 12px;
  font-size: clamp(13px, 3vw, 22px);
  font-weight: bold;
}

.kuzu {
  width: 100%;
  max-height: 430px;
  object-fit: contain;
  display: block;
  margin: auto;
}

@media (max-width: 560px) {

  .container {
    padding: 15px 10px 0;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }

  .box {
    padding: 17px 5px 14px;
    border-radius: 14px;
  }

  .note {
    margin: 15px 0 8px;
  }

  .kuzu {
    max-height: 330px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>⌛ İŞ BİTİŞ SAYACI</h1>

<div class="target">
15 AĞUSTOS 2027
</div>

<div id="countdown" class="grid"></div>

<div class="note">
HEDEFİMİZE KALAN SÜREYİ BİRLİKTE TAKİP EDİYORUZ.
</div>

<img class="kuzu" src="kuzu.png" alt="Kuzu">

</div>

<script>

const target =
new Date("2027-08-15T00:00:00+03:00").getTime();

const el =
document.getElementById("countdown");

function update() {

let diff = target - Date.now();

if (diff <= 0) {
el.innerHTML = "✅ SÜRE DOLDU";
return;
}

const day =
Math.floor(diff / 86400000);

diff %= 86400000;

const hour =
Math.floor(diff / 3600000);

diff %= 3600000;

const minute =
Math.floor(diff / 60000);

diff %= 60000;

const second =
Math.floor(diff / 1000);

el.innerHTML = `

<div class="box">
<div class="num">${day}</div>
<div class="label">GÜN</div>
</div>

<div class="box">
<div class="num">${String(hour).padStart(2,"0")}</div>
<div class="label">SAAT</div>
</div>

<div class="box">
<div class="num">${String(minute).padStart(2,"0")}</div>
<div class="label">DAKİKA</div>
</div>

<div class="box">
<div class="num">${String(second).padStart(2,"0")}</div>
<div class="label">SANİYE</div>
</div>

`;
}

update();

setInterval(update, 1000);

</script>

</body>
</html>
