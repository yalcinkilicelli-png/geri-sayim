<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>15 Ağustos 2027 Geri Sayım</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#eef2f5;
  color:#10254a;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.container{
  width:min(900px,100vw);
  height:100svh;
  background:#fff;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.visual{
  width:100%;
  display:block;
  object-fit:cover;
  object-position:center;
  flex-shrink:0;
}
.top{height:16svh}
.bottom{height:15svh}
.content{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:4px 12px;
}
h1{
  margin:0 0 4px;
  font-size:clamp(24px,5vw,44px);
  letter-spacing:.5px;
}
.target{
  font-size:clamp(17px,3vw,26px);
  font-weight:700;
  color:#3b7f25;
  margin-bottom:10px;
}
.grid{
  width:min(760px,96%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.box{
  background:#102d5b;
  color:#fff;
  border-radius:14px;
  padding:12px 5px;
  box-shadow:0 4px 10px rgba(0,0,0,.16);
}
.num{
  font-size:clamp(28px,5.5vw,56px);
  font-weight:800;
  line-height:1;
}
.label{
  margin-top:5px;
  font-size:clamp(10px,1.8vw,14px);
  color:#8bd12b;
  font-weight:700;
}
.note{
  margin-top:10px;
  font-size:clamp(10px,1.9vw,16px);
  font-weight:700;
}
.done{font-size:28px;font-weight:800;color:#a51e2b}
@media(max-width:560px){
  .top{height:15svh}
  .bottom{height:14svh}
  .grid{gap:6px}
  .box{padding:10px 4px;border-radius:12px}
  .content{padding:3px 8px}
  .note{margin-top:7px}
}
</style>
</head>
<body>
<div class="container">
  <img class="visual top" src="ust-gorsel.png" alt="TÜVTÜRK ve AKTUR">
  <section class="content">
    <h1>⌛ İŞ BİTİŞ SAYACI</h1>
    <div class="target">15 AĞUSTOS 2027</div>
    <div id="countdown" class="grid"></div>
    <div class="note">HEDEFİMİZE KALAN SÜREYİ BİRLİKTE TAKİP EDİYORUZ.</div>
  </section>
  <img class="visual bottom" src="alt-gorsel.png" alt="TURKA ve kuzu">
</div>
<script>
const target = new Date("2027-08-15T00:00:00+03:00").getTime();
const el = document.getElementById("countdown");
function update(){
  let diff = target - Date.now();
  if(diff <= 0){
    el.className="done";
    el.innerHTML="✅ SÜRE DOLDU";
    return;
  }
  const day=Math.floor(diff/86400000); diff%=86400000;
  const hour=Math.floor(diff/3600000); diff%=3600000;
  const minute=Math.floor(diff/60000); diff%=60000;
  const second=Math.floor(diff/1000);
  el.innerHTML=`
    <div class="box"><div class="num">${day}</div><div class="label">GÜN</div></div>
    <div class="box"><div class="num">${String(hour).padStart(2,"0")}</div><div class="label">SAAT</div></div>
    <div class="box"><div class="num">${String(minute).padStart(2,"0")}</div><div class="label">DAKİKA</div></div>
    <div class="box"><div class="num">${String(second).padStart(2,"0")}</div><div class="label">SANİYE</div></div>`;
}
update();
setInterval(update,1000);
</script>
</body>
</html>
