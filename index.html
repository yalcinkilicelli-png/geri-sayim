<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>İş Bitiş Sayacı - 15 Ağustos 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#eef2f5;
  color:#10254a;
  font-family:Arial,Helvetica,sans-serif;
}
.container{
  width:min(900px,100vw);
  height:100svh;
  margin:0 auto;
  background:white;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.top-image,.bottom-image{
  display:block;
  width:100%;
  flex-shrink:0;
  object-fit:contain;
  background:white;
}
.top-image{height:16svh}
.bottom-image{height:16svh}
.content{
  flex:1;
  min-height:0;
  text-align:center;
  padding:8px 12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h1{
  margin:0 0 5px;
  font-size:clamp(28px,6vw,58px);
  letter-spacing:1px;
}
.target{
  font-size:clamp(18px,3.5vw,30px);
  font-weight:700;
  color:#3b7f25;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.box{
  background:#102d5b;
  color:white;
  border-radius:16px;
  padding:14px 6px;
  box-shadow:0 5px 12px rgba(0,0,0,.18);
}
.num{
  font-size:clamp(30px,7vw,68px);
  font-weight:800;
  line-height:1;
}
.label{
  margin-top:7px;
  font-size:clamp(11px,2vw,17px);
  color:#8bd12b;
  font-weight:700;
}
.note{
  margin-top:12px;
  font-size:clamp(12px,3vw,23px);
  font-weight:700;
}
.done{font-size:32px;font-weight:800;color:#a51e2b}
@media(max-width:560px){
  .top-image{height:15svh}
  .bottom-image{height:15svh}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .content{padding:6px 10px}
  .box{padding:12px 5px;border-radius:14px}
  .target{margin-bottom:10px}
  .note{margin-top:9px}
}
</style>
</head>
<body>
<div class="container">
  <img class="top-image" src="ust-gorsel.png" alt="TÜVTÜRK ve AKTUR">
  <section class="content">
    <h1>⌛ İŞ BİTİŞ SAYACI</h1>
    <div class="target">15 AĞUSTOS 2027</div>
    <div id="countdown" class="grid"></div>
    <div class="note">HEDEFİMİZE KALAN SÜREYİ BİRLİKTE TAKİP EDİYORUZ.</div>
  </section>
  <img class="bottom-image" src="alt-gorsel.png" alt="15 Ağustos 2027 sonrası TURKA ve kuzu">
</div>
<script>
const target = new Date("2027-08-15T00:00:00+03:00").getTime();
const el = document.getElementById("countdown");
function update(){
  let diff = target - Date.now();
  if(diff <= 0){
    el.className = "done";
    el.innerHTML = "✅ SÜRE DOLDU";
    return;
  }
  const day=Math.floor(diff/86400000); diff%=86400000;
  const hour=Math.floor(diff/3600000); diff%=3600000;
  const minute=Math.floor(diff/60000); diff%=60000;
  const second=Math.floor(diff/1000);
  el.innerHTML=`
    <div class="box"><div class="num">${day}</div><div class="label">GÜN</div></div>
    <div class="box"><div class="num">${String(hour).padStart(2,"0")}</div><div class="label">SAAT</div></div>
    <div class="box"><div class="num">${String(minute).padStart(2,"0")}</div><div class="label">DAKİKA</div></div>
    <div class="box"><div class="num">${String(second).padStart(2,"0")}</div><div class="label">SANİYE</div></div>`;
}
update(); setInterval(update,1000);
</script>
</body>
</html>
