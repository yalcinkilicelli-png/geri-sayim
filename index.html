<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İş Bitiş Sayacı - 15 Ağustos 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f5;display:flex;justify-content:center;align-items:center}
.page{
 width:min(900px,100vw); height:100vh; height:100svh;
 background:#fff; display:flex; flex-direction:column; overflow:hidden;
}
.top{width:100%;height:17%;object-fit:contain;display:block}
.bottom{width:100%;height:25%;object-fit:contain;display:block}
.content{
 flex:1; min-height:0; display:flex; flex-direction:column;
 justify-content:center; align-items:center; text-align:center;
 padding:2px 10px;
}
h1{margin:0 0 2px;font-size:clamp(22px,5vw,42px);color:#10254a}
.target{margin:0 0 7px;font-size:clamp(16px,3.2vw,25px);font-weight:800;color:#3b7f25}
.grid{width:min(760px,98%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.box{background:#102d5b;color:#fff;border-radius:12px;padding:9px 4px;box-shadow:0 2px 7px rgba(0,0,0,.15)}
.num{font-size:clamp(27px,5.5vw,54px);font-weight:800;line-height:1}
.label{margin-top:4px;font-size:clamp(10px,1.8vw,14px);color:#8bd12b;font-weight:800}
.note{margin-top:6px;font-size:clamp(10px,1.8vw,16px);font-weight:700;color:#10254a}
.done{font-size:25px;font-weight:800;color:#a51e2b}
@media(max-width:560px){
 .top{height:16%}.bottom{height:27%}
 .content{padding:2px 7px}
 .grid{gap:5px}.box{padding:8px 3px;border-radius:11px}
 .note{display:none}
}
</style>
</head>
<body>
<div class="page">
<img class="top" src="ust-sade.png" alt="TÜVTÜRK ve AKTUR">
<section class="content">
<h1>⌛ İŞ BİTİŞ SAYACI</h1>
<div class="target">15 AĞUSTOS 2027</div>
<div id="countdown" class="grid"></div>
</section>
<img class="bottom" src="alt-sade.png" alt="15 Ağustos 2027 sonrası TURKA ve kuzu">
</div>
<script>
const target=new Date("2027-08-15T00:00:00+03:00").getTime();
const el=document.getElementById("countdown");
function update(){
 let diff=target-Date.now();
 if(diff<=0){el.className="done";el.innerHTML="✅ SÜRE DOLDU";return;}
 const day=Math.floor(diff/86400000);diff%=86400000;
 const hour=Math.floor(diff/3600000);diff%=3600000;
 const minute=Math.floor(diff/60000);diff%=60000;
 const second=Math.floor(diff/1000);
 el.innerHTML=`
 <div class="box"><div class="num">${day}</div><div class="label">GÜN</div></div>
 <div class="box"><div class="num">${String(hour).padStart(2,"0")}</div><div class="label">SAAT</div></div>
 <div class="box"><div class="num">${String(minute).padStart(2,"0")}</div><div class="label">DAKİKA</div></div>
 <div class="box"><div class="num">${String(second).padStart(2,"0")}</div><div class="label">SANİYE</div></div>`;
}
update();setInterval(update,1000);
</script>
</body>
</html>
